services:
  ngalihya-pdf:
    container_name: ngalihya-pdf
    image: ngalihya-pdf:latest
    build:
      context: .
      dockerfile: docker/embedded/Dockerfile
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080$${SYSTEM_ROOTURIPATH:-''}/api/v1/info/status | grep -q 'UP'"]
      interval: 10s
      timeout: 10s
      retries: 18
    ports:
      - "${NGALIHIYA_PDF_PORT:-8080}:8080"
    volumes:
      - ./stirling/ngalihya/data:/usr/share/tessdata:rw
      - ./stirling/ngalihya/config:/configs:rw
      - ./stirling/ngalihya/logs:/logs:rw
      - ./stirling/ngalihya/storage:/storage:rw
    environment:
      DISABLE_ADDITIONAL_FEATURES: "false"
      SECURITY_ENABLELOGIN: "${NGALIHIYA_ENABLE_LOGIN:-false}"
      SECURITY_INITIALLOGIN_ENABLED: "${NGALIHIYA_ENABLE_LOGIN:-false}"
      SECURITY_INITIALLOGIN_USERNAME: "${NGALIHIYA_ADMIN_USER:-admin}"
      SECURITY_INITIALLOGIN_PASSWORD: "${NGALIHIYA_ADMIN_PASSWORD:-change-this-before-enabling-login}"
      PROCESS_EXECUTOR_AUTO_UNO_SERVER: "true"
      PROCESS_EXECUTOR_SESSION_LIMIT_LIBRE_OFFICE_SESSION_LIMIT: "1"
      PUID: "${NGALIHIYA_PUID:-1000}"
      PGID: "${NGALIHIYA_PGID:-1000}"
      UMASK: "022"
      SYSTEM_DEFAULTLOCALE: "en-US"
      SYSTEM_MAXFILESIZE: "${NGALIHIYA_MAX_FILE_SIZE_MB:-100}"
      SYSTEM_GOOGLEVISIBILITY: "true"
      SYSTEM_ENABLEURLTOPDF: "false"
      SYSTEM_SHOWUPDATE: "false"
      UI_APPNAME: "Ngalihya PDF"
      UI_APPNAMENAVBAR: "Ngalihya PDF"
      UI_HOMEDESCRIPTION: "Free online PDF tools to merge, compress, convert, edit, OCR, sign, watermark, and protect documents."
      METRICS_ENABLED: "false"
      SHOW_SURVEY: "false"
    restart: unless-stopped
